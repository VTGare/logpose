version: "3"

vars:
  BINARY_NAME: logpose
  GOLANGCI_LINT_VERSION: v2.15.0
  # Built for the host so GOOS=windows only changes what gets linted.
  GOLANGCI_LINT: out/tools/golangci-lint-{{.GOLANGCI_LINT_VERSION}}
  # Go's default is 10 minutes. Fail hung tests sooner.
  TEST_TIMEOUT: 60s

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the Windows binary into out/bin/
    cmds:
      - mkdir -p out/bin
      - GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H=windowsgui" -o out/bin/{{.BINARY_NAME}}.exe ./cmd/logpose

  test:
    desc: Run the specs (extra go test args after --, e.g. task test -- ./internal/godot/...)
    cmds:
      - go test -timeout {{.TEST_TIMEOUT}} {{.CLI_ARGS | default "./..."}}

  test:race:
    desc: Run the specs with the race detector (run before committing)
    cmds:
      - go test -race -timeout {{.TEST_TIMEOUT}} {{.CLI_ARGS | default "./..."}}

  cover:
    desc: Run the specs with coverage and print a per-function summary
    cmds:
      - mkdir -p out
      - go test -timeout {{.TEST_TIMEOUT}} -coverprofile=out/profile.cov ./...
      - go tool cover -func out/profile.cov

  tools:
    desc: Build the pinned golangci-lint into out/tools/
    status:
      - test -x {{.GOLANGCI_LINT}}
    cmds:
      - mkdir -p out/tools
      - GOBIN=$PWD/out/tools go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - mv out/tools/golangci-lint {{.GOLANGCI_LINT}}

  fmt:
    desc: Format the code with gofumpt and goimports
    deps: [tools]
    cmds:
      - "{{.GOLANGCI_LINT}} fmt ./..."

  vet:
    desc: Run go vet for Linux and Windows
    cmds:
      - go vet ./...
      - GOOS=windows go vet ./...

  lint:
    desc: Run golangci-lint with revive for Linux and Windows (pinned version, built on first use)
    deps: [tools]
    cmds:
      - "{{.GOLANGCI_LINT}} run ./..."
      - GOOS=windows {{.GOLANGCI_LINT}} run ./...

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  check:
    desc: Everything to run before committing (format check, vet, lint, race tests)
    deps: [tools]
    cmds:
      - "{{.GOLANGCI_LINT}} fmt --diff ./..."
      - task: vet
      - task: lint
      - task: test:race

  clean:
    desc: Remove build output
    cmds:
      - rm -rf ./out
